<!doctype html><meta charset="utf-8"><title>Alifbo hujjat konvertori tekshiruvi</title><h1>Hujjat konvertori tekshiruvi</h1><pre id="results">Tekshiruvlar bajarilmoqda…</pre><script src="../dist/vendor/jszip.min.js"></script><script src="../dist/converter.js"></script><script type="module">
import {readFile,convertFile,convertParts} from '../dist/file-engine.mjs';
const results=[],assert=(v,m)=>{if(!v)throw Error(m)};
async function fixture(name){const response=await fetch('./fixtures/'+name);return new File([await response.arrayBuffer()],name);}
async function test(name,run){try{await run();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}document.getElementById('results').textContent=results.join('\n')}
await test('DOCX: mixed formatting, split digraphs, header and media preservation',async()=>{
const input=await readFile(await fixture('namuna.docx'));const result=await convertFile(input,false);const zip=await JSZip.loadAsync(await result.blob.arrayBuffer());const source=await zip.file('word/document.xml').async('string');const doc=new DOMParser().parseFromString(source,'application/xml');const texts=Array.from(doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','t')).map(n=>n.textContent);
assert(texts.join('').includes('Özbekiston Şahar çiroyli, ğayrat.'),'split runs failed');assert(texts.slice(-2).join('|')==='s|h','break incorrectly merged');assert(source.includes('<w:b')&&source.includes('<w:i'),'format lost');assert((await zip.file('word/header1.xml').async('string')).includes('ÖZBEK ŞAHAR'),'header not converted');assert(String(await zip.file('word/media/keep.bin').async('uint8array'))==='1,4,9,16,25','media changed');assert(result.filename==='namuna-alifbo.docx','filename wrong');
const roundtrip=await readFile(new File([result.blob],'reverse.docx'));const reverse=await convertFile(roundtrip,true);assert(reverse.text.includes('O‘zbekiston Shahar chiroyli, g‘ayrat.'),'reverse failed');
});
await test('PPTX: relationship slide order, split runs and original media',async()=>{const input=await readFile(await fixture('namuna.pptx'));assert(input.text.startsWith("O'zbekiston"),'slide order wrong');assert(input.pages===2,'slide count');const out=await convertFile(input,false);const zip=await JSZip.loadAsync(await out.blob.arrayBuffer());const slide=await zip.file('ppt/slides/slide1.xml').async('string');assert(slide.includes('Ş')&&slide.includes('ahar çiroyli'),'pptx runs');assert(slide.includes('b="1"'),'style lost');assert(String(await zip.file('ppt/media/keep.bin').async('uint8array'))==='9,8,7,6','ppt media changed');});
await test('PDF: two pages extracted and exported as PDF',async()=>{const input=await readFile(await fixture('namuna.pdf'));assert(input.pages===2,'page count');assert(input.text.includes("O'zbekiston"),'pdf text missing');const out=await convertFile(input,false);assert(out.blob.type==='application/pdf','pdf MIME');assert(out.filename==='namuna-alifbo.pdf','pdf filename');const roundtrip=await readFile(new File([out.blob],'roundtrip.pdf'));assert(roundtrip.text.includes('Özbekiston. Şahar va çiroyli boğlar.'),'PDF Unicode roundtrip');assert(roundtrip.pages===2,'page boundaries');});
await test('PDF: image-only/empty text explains OCR limitation',async()=>{let rejected=false;try{await readFile(await fixture('scanned.pdf'))}catch(e){rejected=e.message.includes('OCR')}assert(rejected,'no OCR message');});
await test('Reject corrupt DOCX and legacy DOC',async()=>{for(const name of ['bad.docx','unsupported.doc']){let rejected=false;try{await readFile(await fixture(name))}catch{rejected=true}assert(rejected,name+' accepted')}});
await test('TXT: unicode and reverse capitals',async()=>{const doc=await readFile(await fixture('namuna.txt'));const out=await convertFile(doc,false);assert(out.text==='Ğayrat, özbek, Şahar, çiroy.','txt');const parts=[{text:'Ş'},{text:'AHAR Ç'},{text:'IROY'}];assert(convertParts(parts,true).join('')==='SHAHAR CHIROY','reverse capitals across runs')});
await test('File size limit',async()=>{let rejected=false;try{await readFile({name:'huge.pdf',size:21*1024*1024})}catch(e){rejected=e.message.includes('20 MB')}assert(rejected,'size guard')});
document.getElementById('results').textContent+='\nDONE '+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length;
</script>
